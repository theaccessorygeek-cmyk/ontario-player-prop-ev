
name: Collect NHL Player Game Logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect Connor McDavid game logs
        run: |
          python -m src.nhl_game_logs \
            --player-id 8478402 \
            --seasons 20222023 20232024 20242025 20252026 20262027

      - name: Save NHL game logs
        uses: actions/upload-artifact@v6
        with:
          name: nhl-player-game-logs
          path: data/nhl_player_game_logs.csv
          retention-days: 7
          
